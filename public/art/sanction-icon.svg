<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="coin" x1="24" y1="20" x2="104" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE08A"/>
      <stop offset="0.45" stop-color="#E6B84A"/>
      <stop offset="1" stop-color="#B8871F"/>
    </linearGradient>
    <linearGradient id="ban" x1="20" y1="108" x2="108" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7A6A"/>
      <stop offset="1" stop-color="#C62828"/>
    </linearGradient>
  </defs>
  <!-- coin -->
  <circle cx="64" cy="64" r="40" fill="url(#coin)" stroke="#6B4E12" stroke-width="3"/>
  <circle cx="64" cy="64" r="31" fill="none" stroke="#8A6A1C" stroke-width="2" opacity="0.7"/>
  <text x="64" y="78" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#5A3F0E">$</text>
  <!-- prohibition ring -->
  <circle cx="64" cy="64" r="52" stroke="url(#ban)" stroke-width="10" fill="none"/>
  <path d="M28 100 L100 28" stroke="url(#ban)" stroke-width="10" stroke-linecap="round"/>
</svg>
