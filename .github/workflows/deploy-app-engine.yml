name: Deploy to GCP App Engine

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write Firebase env for client build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_FIRESTORE_DATABASE: ${{ secrets.VITE_FIREBASE_FIRESTORE_DATABASE }}
        run: |
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
          VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
          VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
          VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
          VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
          VITE_FIREBASE_FIRESTORE_DATABASE=${VITE_FIREBASE_FIRESTORE_DATABASE:-nuclear-war}
          EOF

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate to Google Cloud
        env:
          GCLOUD_SERVICE_KEY: ${{ secrets.GCLOUD_SERVICE_KEY }}
          GCLOUD_PROJECT_ID: ${{ secrets.GCLOUD_PROJECT_ID }}
        run: |
          if [ -z "$GCLOUD_SERVICE_KEY" ] || [ -z "$GCLOUD_PROJECT_ID" ]; then
            echo "Missing secrets: GCLOUD_SERVICE_KEY and GCLOUD_PROJECT_ID are required."
            exit 1
          fi
          echo "$GCLOUD_SERVICE_KEY" | base64 -d > "${RUNNER_TEMP}/gcloud-service-key.json"
          gcloud auth activate-service-account --key-file="${RUNNER_TEMP}/gcloud-service-key.json"
          gcloud config set project "$GCLOUD_PROJECT_ID"

      - name: Deploy to App Engine
        run: gcloud app deploy app.yaml --quiet --promote
